name: agent behavior

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Replay the portable demonstration cassette
        uses: ./
        with:
          suite: demo/cassettes
          fail-on: outcome
