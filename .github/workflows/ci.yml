name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the embedded web bundle
        run: npm ci --prefix web && npm run build --prefix web
      - name: Build the public website
        run: npm run build:site --prefix web
      - name: Audit frontend dependencies
        run: npm audit --prefix web --audit-level=moderate
      - name: Verify the checked-in bundle is current
        run: test -z "$(git status --porcelain -- web/dist)"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      # No module download step: this project has no dependencies, and that
      # is worth keeping true. If go.sum ever appears, it should be because
      # someone argued for it in a PR.
      - name: Verify there are still no dependencies
        run: |
          if [ -s go.sum ]; then
            echo "go.sum is non-empty; cassette is meant to build from stdlib only."
            echo "If a dependency is genuinely warranted, remove this check in the same PR and say why."
            exit 1
          fi

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: make build

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
      - name: Cross-compile the release matrix
        run: make dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: Scan all fetched Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact
