name: static demo

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the public website
        run: npm ci --prefix web && npm run build:site --prefix web

      - name: Assemble the backend-free demo
        run: |
          site="${RUNNER_TEMP}/cassette-public-demo"
          mkdir -p "$site/api"
          cp -R web/site-dist/. "$site/"
          cp -R web/fixtures/api/. "$site/api/"

      - name: Preserve the static site as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cassette-public-demo
          path: ${{ runner.temp }}/cassette-public-demo

      - name: Check deployment configuration
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          wranglerVersion: "4"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/cassette-public-demo --project-name=cassette-agent-replay
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
