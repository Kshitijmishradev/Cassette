name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify embedded viewer and frontend dependencies
        run: |
          npm ci --prefix web
          npm run build --prefix web
          test -z "$(git status --porcelain -- web/dist)"
          npm audit --prefix web --audit-level=moderate
      - name: Scan release source
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Test release source
        run: go test -race ./... && go vet ./...
      - name: Validate archive configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "v2.18.1"
          args: release --snapshot --skip=publish --clean
      - name: Check every platform archive
        run: python3 scripts/check-release.py dist
      - name: Release archives and update the Homebrew tap
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "v2.18.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
