name: Cassette agent behavior
description: Replay an agent against recorded MCP cassettes and report behavioral changes

inputs:
  suite:
    description: Directory containing recorded cassette cases
    default: ./cassettes
  fail-on:
    description: Failure policy (outcome, path, or never)
    default: outcome
  jobs:
    description: Number of cassette cases to replay concurrently
    default: "0"
  agent:
    description: Optional shell command that replaces the agent command recorded in every manifest
    default: ""
  github-token:
    description: Token used to create or update the pull-request comment
    default: ""

outputs:
  exit-code:
    description: 0 for pass, 1 for behavior change, 2 for harness error
    value: ${{ steps.replay.outputs.exit-code }}
  report-file:
    description: Path to the Markdown report generated by the action
    value: ${{ steps.replay.outputs.report-file }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27"

    - name: Build Cassette
      id: build
      shell: bash
      run: |
        set -euo pipefail
        bin_dir="${RUNNER_TEMP}/cassette-action-bin"
        mkdir -p "$bin_dir"
        (
          cd "$GITHUB_ACTION_PATH"
          go build -trimpath -o "$bin_dir/cassette" ./cmd/cassette
        )
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "binary=$bin_dir/cassette" >> "$GITHUB_OUTPUT"

    - name: Replay cassette suite
      id: replay
      shell: bash
      env:
        CASSETTE_ACTION_AGENT: ${{ inputs.agent }}
        CASSETTE_ACTION_FAIL_ON: ${{ inputs.fail-on }}
        CASSETTE_ACTION_JOBS: ${{ inputs.jobs }}
        CASSETTE_ACTION_SUITE: ${{ inputs.suite }}
        CASSETTE_ACTION_BINARY: ${{ steps.build.outputs.binary }}
      run: |
        set -uo pipefail
        raw_report="${RUNNER_TEMP}/cassette-behavior.txt"
        markdown_report="${RUNNER_TEMP}/cassette-behavior.md"
        args=(
          test
          --suite "$CASSETTE_ACTION_SUITE"
          --hermetic
          --fail-on "$CASSETTE_ACTION_FAIL_ON"
          --jobs "$CASSETTE_ACTION_JOBS"
        )
        if [[ -n "$CASSETTE_ACTION_AGENT" ]]; then
          args+=(-- bash -lc "$CASSETTE_ACTION_AGENT")
        fi

        set +e
        "$CASSETTE_ACTION_BINARY" "${args[@]}" >"$raw_report" 2>&1
        status=$?
        set -e

        {
          echo '<!-- cassette-agent-behavior -->'
          echo '### Cassette agent behavior'
          echo
          case "$status" in
            0) echo '✅ No behavior change crossed the configured failure policy.' ;;
            1) echo '❌ The agent changed behavior beyond the configured failure policy.' ;;
            *) echo '⚠️ The behavior test could not complete.' ;;
          esac
          echo
          echo '<details><summary>Replay details</summary>'
          echo
          sed 's/^/    /' "$raw_report"
          echo
          echo '</details>'
        } >"$markdown_report"

        cat "$markdown_report" >> "$GITHUB_STEP_SUMMARY"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "report-file=$markdown_report" >> "$GITHUB_OUTPUT"

    - name: Comment on pull request
      if: always() && github.event_name == 'pull_request' && inputs.github-token != ''
      uses: actions/github-script@v7
      env:
        CASSETTE_REPORT_FILE: ${{ steps.replay.outputs.report-file }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- cassette-agent-behavior -->';
          const body = fs.readFileSync(process.env.CASSETTE_REPORT_FILE, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100
          });
          const previous = comments.find(comment =>
            comment.user?.type === 'Bot' && comment.body?.includes(marker)
          );
          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce behavior result
      if: always()
      shell: bash
      env:
        CASSETTE_ACTION_EXIT_CODE: ${{ steps.replay.outputs.exit-code }}
      run: exit "${CASSETTE_ACTION_EXIT_CODE:-2}"
